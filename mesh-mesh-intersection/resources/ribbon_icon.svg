<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="planeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB6FF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="planeOrange" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#C2610A"/>
    </linearGradient>
  </defs>

  <!-- 面 A：蓝色三角网格面 -->
  <polygon points="6,42 32,26 58,40 32,56" fill="url(#planeBlue)" fill-opacity="0.72"
           stroke="#9CC5FF" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M19,34 L45,48 M19,48 L45,34" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.9"/>

  <!-- 面 B：橙色三角网格面 -->
  <polygon points="20,10 44,22 44,46 20,34" fill="url(#planeOrange)" fill-opacity="0.7"
           stroke="#FFD699" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32,16 L32,40 M20,22 L44,34 M20,28 L44,40" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.9"/>

  <!-- 交线多边形：外发光 + 主线 + 折线顶点 -->
  <polyline points="10,45 24,38 40,40 54,47" fill="none" stroke="#FF8F00" stroke-opacity="0.4"
            stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="10,45 24,38 40,40 54,47" fill="none" stroke="#FFC107"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFE082" stroke="#7C4A03" stroke-width="1.1">
    <circle cx="10" cy="45" r="2.3"/>
    <circle cx="24" cy="38" r="2.3"/>
    <circle cx="40" cy="40" r="2.3"/>
    <circle cx="54" cy="47" r="2.3"/>
  </g>
</svg>
