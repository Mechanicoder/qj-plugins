<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sheetBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB6FF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sheetOrange" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#C2610A"/>
    </linearGradient>
  </defs>

  <g transform="translate(-4,-2) scale(0.78)">
    <!-- 蓝色曲面 -->
    <path d="M5,39 C14,29 27,26 37,32 C45,37 53,39 60,37 L60,47 C53,50 44,48 36,42 C27,35 15,37 5,50 Z"
          fill="url(#sheetBlue)" fill-opacity="0.72" stroke="#9CC5FF" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 橙色曲面 -->
    <path d="M21,6 C30,11 36,20 38,31 C39,40 37,48 31,54 L23,50 C29,44 32,37 31,29 C29,19 24,13 15,9 Z"
          fill="url(#sheetOrange)" fill-opacity="0.7" stroke="#FFD699" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- 精确交线 -->
    <path d="M8,43 C18,35 28,33 37,38 C45,42 52,43 58,41" fill="none" stroke="#FF8F00"
          stroke-opacity="0.4" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M8,43 C18,35 28,33 37,38 C45,42 52,43 58,41" fill="none" stroke="#FFC107"
          stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- 对比测试：放大镜 -->
  <circle cx="47" cy="46" r="9.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5"/>
  <circle cx="47" cy="46" r="7.8" fill="#FFFFFF" fill-opacity="0.18" stroke="#1F2937" stroke-width="2.6"/>
  <line x1="52.5" y1="51.5" x2="58.2" y2="57.2" stroke="#FFFFFF" stroke-opacity="0.9"
        stroke-width="6" stroke-linecap="round"/>
  <line x1="52.5" y1="51.5" x2="58.2" y2="57.2" stroke="#1F2937"
        stroke-width="3.2" stroke-linecap="round"/>
</svg>
